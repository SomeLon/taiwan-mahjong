<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台灣麻將</title>
  <meta name="description" content="台灣十六張麻將，和三位電腦對打，可選簡單、普通、困難。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">雀</span>台灣十六張</div>
    <div class="topinfo" id="topinfo"></div>
    <div class="topbtns">
      <button class="btn ghost" id="btn-rules" type="button">台數表</button>
      <button class="btn ghost" id="btn-restart" type="button">重新開始</button>
    </div>
  </header>

  <main class="table" id="table">
    <section class="seat seat-top" id="seat-2"></section>
    <section class="seat seat-left" id="seat-3"></section>
    <section class="center" id="center">
      <div class="river river-2" id="river-2"></div>
      <div class="river river-3" id="river-3"></div>
      <div class="info" id="info"></div>
      <div class="river river-1" id="river-1"></div>
      <div class="river river-0" id="river-0"></div>
    </section>
    <section class="seat seat-right" id="seat-1"></section>
    <section class="seat seat-bottom" id="seat-0"></section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/tiles.js"></script>
  <script src="js/shanten.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
